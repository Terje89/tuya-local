name: Garage door
products:
  - id: rxjnauytlvlczvcq
    manufacturer: Belko
    model: ProLift 1200N
  - id: qxs8hcixJWb0pjht
    manufacturer: Boxer
    model: 4000 Premium
entities:
  - entity: cover
    class: garage
    dps:
      - id: 101
        type: boolean
        name: control
        mapping:
          - dps_val: true
            value: open
          - dps_val: false
            constraint: close_btn
            conditions:
              - dps_val: true
                value_redirect: close_btn
                value: close
              - dps_val: false
                value_redirect: stop_btn
                value: stop
      - id: 102
        type: boolean
        name: close_btn
        mapping:
          - dps_val: true
            value: close
      - id: 103
        type: boolean
        name: stop_btn
        mapping:
          - dps_val: true
            value: stop
      - id: 104
        type: integer
        name: current_position
      - id: 104
        type: integer
        name: action
        mapping:
          - dps_val: null
          - dps_val: 0
            value: closed
          - value: opened
